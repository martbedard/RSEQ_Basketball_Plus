name: Vérifier l’actualisation horaire
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency: rattrapage-classement

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Relancer si le classement de cette heure manque
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          heure=$(date -u +%Y-%m-%dT%H)
          url="https://martbedard.github.io/RSEQ_Basketball/data.json"
          if curl --fail --silent --show-error --retry 2 --max-time 15 "$url?verification=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              | jq -e --arg heure "$heure" '.updated | startswith($heure)' > /dev/null; then
            echo "Le site a déjà publié une extraction pour cette heure UTC ($heure)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          en_cours=$(gh run list --workflow classement.yml --branch main --limit 20 \
            --json status --jq 'any(.[]; .status != "completed")')
          if [[ "$en_cours" == true ]]; then
            echo "Une actualisation est déjà en cours." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh workflow run classement.yml --ref main
          echo "Une nouvelle extraction a été demandée sur main." >> "$GITHUB_STEP_SUMMARY"
